function saveLocal(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,profile:state.remember?state.profile:null,remember:state.remember,saved:state.saved,checks:state.checks}));return true;}catch{toast('브라우저 저장이 차단되어 이 탭에서만 유지됩니다.');return false;}}
function validateProfile(p){return p&&REGIONS.includes(p.region)&&Object.hasOwn(INDUSTRIES,p.industry)&&validDate(p.opened)&&p.opened<=koreaToday()&&Number.isInteger(p.employees)&&p.employees>=0&&p.employees<=100000&&Number.isFinite(p.revenue)&&p.revenue>=0&&p.revenue<=100000000&&Number.isInteger(p.age)&&p.age>=18&&p.age<=120&&typeof p.district==='string'&&p.district.length<=30;}
function loadLocal(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!data||data.version!==1)return;if(validateProfile(data.profile)&&data.remember){state.profile=data.profile;state.remember=true;}if(Array.isArray(data.saved))state.saved=data.saved.filter(x=>typeof x==='string'&&x.length<100).slice(0,2000);if(data.checks&&typeof data.checks==='object'&&!Array.isArray(data.checks)){for(const [key,value] of Object.entries(data.checks)){if(/^(?:PBLN_|GANGHWA-)[-\w]{1,90}$/.test(key)&&Array.isArray(value))state.checks[key]=value.filter(x=>Number.isInteger(x)&&x>=0&&x<100);}}}catch{}}
function selected(a,b){return a===b?' selected':'';}function checked(v){return v?' checked':'';}
function selectOptions(values,current,placeholder='선택해 주세요'){return `<option value="">${placeholder}</option>`+values.map(v=>`<option value="${esc(v)}"${selected(v,current)}>${esc(v)}</option>`).join('');}
function dateLabel(p){return p.rule==='imported'?'가져온 날짜 · 원문 미확인':'출처 확인';}
function sourceStamp(){return `<p class="snapshot-note">${icon('info')}<span>${esc(state.feedLabel)} · ${state.feed.some(p=>p.rule==='imported')?'가져옴(원문 확인 아님)':'확인'} ${esc(state.feedDate)} · 수록 ${state.feed.length}건. 전체 정부지원사업 목록이 아닙니다. 접수 상황은 원문에서 확인하세요.</span></p>`;}
function staleNote(){const age=dateDiff(koreaToday(),state.feedDate);return age>7?`<div class="inline-note">공고 확인 후 ${age}일이 지났습니다. 변경·조기마감 여부를 공식 공고에서 다시 확인해 주세요.</div>`:'';}
function getProgram(id){return state.feed.find(p=>p.id===id);}
function navigate(hash){if(location.hash===hash){render();window.scrollTo(0,0);}else location.hash=hash;}
function openModal(title,content){$('#modal-title').textContent=title;$('#modal-body').innerHTML=content;if(!$('#modal').open)$('#modal').showModal();}
function profileForm(){const p=state.profile||{};return `<form id="profile-form" class="profile-card"><div class="card-heading"><h2>우리 사업, 어떤 기회가 있을까요?</h2><span class="badge">무료 진단</span></div><p class="card-intro">사업자등록번호 없이 기본 정보로 시작하세요.</p><div class="form-grid"><div class="field"><label for="region">사업장 지역 <span class="required">*</span></label><select id="region" name="region" required>${selectOptions(REGIONS,p.region,'시·도 선택')}</select></div><div class="field"><label for="district">시·군·구 <span class="muted">(선택)</span></label><input id="district" name="district" value="${esc(p.district)}" placeholder="예: 강남구, 강화군" maxlength="30"><div class="helper">지역사업 확인을 위해 정확한 명칭 입력</div></div><div class="field"><label for="industry">업종 <span class="required">*</span></label><select id="industry" name="industry" required><option value="">업종 선택</option>${Object.entries(INDUSTRIES).map(([k,v])=>`<option value="${k}"${selected(k,p.industry)}>${v}</option>`).join('')}</select></div><div class="field"><label for="opened">사업 개시일 <span class="required">*</span></label><input id="opened" name="opened" type="date" min="1900-01-01" max="${koreaToday()}" value="${esc(p.opened)}" required></div><div class="field"><label for="employees">상시 직원 수 <span class="required">*</span></label><input id="employees" name="employees" type="number" min="0" max="100000" step="1" value="${esc(p.employees)}" placeholder="대표자 제외 · 명" required></div><div class="field"><label for="revenue">최근 연매출 <span class="required">*</span></label><input id="revenue" name="revenue" type="number" min="0" max="100000000" step="1" value="${esc(p.revenue)}" placeholder="만원 단위 · 2억원 = 20000" required></div><div class="field"><label for="age">대표자 만 나이 <span class="required">*</span></label><input id="age" name="age" type="number" min="18" max="120" step="1" value="${esc(p.age)}" placeholder="예: 48" required></div><div class="field"><label for="active">현재 영업 상태 <span class="required">*</span></label><select id="active" name="active" required><option value="">선택해 주세요</option><option value="yes"${selected('yes',p.active)}>정상 영업 중</option><option value="no"${selected('no',p.active)}>휴·폐업 / 개업 전</option></select></div></div><details class="profile-extra"><summary>조건을 더 정확히 확인하려면 · 선택 정보 3개</summary><div class="form-grid"><div class="field"><label for="certificate">소상공인확인서 발급 가능</label><select id="certificate" name="certificate"><option value="unknown"${selected('unknown',p.certificate)}>아직 모르겠어요</option><option value="yes"${selected('yes',p.certificate)}>발급 가능 / 보유</option><option value="no"${selected('no',p.certificate)}>발급 불가 / 미확인</option></select></div><div class="field"><label for="store">영업 점포 운영</label><select id="store" name="store"><option value="unknown"${selected('unknown',p.store)}>아직 선택하지 않음</option><option value="yes"${selected('yes',p.store)}>점포 있음</option><option value="no"${selected('no',p.store)}>점포 없음</option></select></div><div class="field full"><label for="insurance">사업주 자영업자 고용보험 가입</label><select id="insurance" name="insurance"><option value="unknown"${selected('unknown',p.insurance)}>아직 모르겠어요</option><option value="yes"${selected('yes',p.insurance)}>가입했어요</option><option value="no"${selected('no',p.insurance)}>가입하지 않았어요</option></select></div></div></details><label class="check-label"><input type="checkbox" id="remember" name="remember"${checked(state.remember)}>이 기기에 사업 정보를 저장합니다. 공용 기기에서는 선택하지 마세요.</label><button type="submit" class="btn btn-green btn-full">무료로 지원사업 찾아보기 ${icon('arrow')}</button><p id="profile-error" class="form-error" role="status"></p><div class="form-bottom"><button type="button" class="link-btn" data-action="example">서울 카페 예시로 체험하기</button><span class="micro muted">입력 정보는 이 화면에서 비교합니다.</span></div></form>`;}
function programCard(p,withMatch=false){const match=state.profile?compareProgram(p,state.profile):null;const period=periodState(p);return `<article class="program-card"><div class="program-top"><div class="badges"><span class="badge${p.kind==='loan'?' purple':''}">${esc(p.category)}</span><span class="badge gray">${p.regions.length?esc(p.regions.join('·')):'전국'}</span></div><button type="button" class="save-btn" data-action="save" data-id="${esc(p.id)}" aria-label="${esc(p.title)} 관심 저장" aria-pressed="${state.saved.includes(p.id)}">${icon('bookmark')}</button></div><p class="program-meta">${esc(p.agency)}</p><h3><a href="#detail/${encodeURIComponent(p.id)}">${esc(p.title)}</a></h3><p class="program-benefit">${esc(p.benefit)}</p><p class="summary">${esc(p.summary)}</p><div class="card-match">${icon(withMatch&&match?.excluded?'info':'check')}${withMatch&&match?`${esc(match.label)} · ${match.known}항목 일치 / ${match.unknown}항목 확인 필요`:(p.rule==='imported'?'가져온 공고 · 원문 검토 필요':'공식 출처 확인 · 상세 조건은 원문에서')}</div><div class="program-footer"><span class="deadline">${esc(period.label)}</span><a class="link-btn" href="#detail/${encodeURIComponent(p.id)}">조건 확인 ${icon('arrow')}</a></div></article>`;}
function homeView(){return `<section class="hero"><div class="container"><div class="hero-grid"><div><span class="badge"><span class="tiny-dot"></span>사업자 맞춤 지원사업 탐색</span><h1>사장님이 놓친 기회,<br><em>사업비서가 찾아요.</em></h1><p class="hero-desc">복잡한 공고를 하나하나 뒤지지 마세요.<br>우리 사업과 관련된 지원사업을 찾고,<br>왜 해당되는지, 무엇을 준비할지 확인하세요.</p><div class="hero-points"><span>${icon('check')}공식 공고 기반</span><span>${icon('check')}무료 조건 확인</span><span>${icon('check')}회원가입 없이 시작</span></div><div class="notice-mini"><span class="mini-bell">${icon('bell')}</span><div><strong>이런 기회가 새로 생기면 알려드릴게요.</strong><p>맞춤 신규공고 · 마감 전 알림 · 출시 준비 중</p></div><span class="mini-time">알림 예시</span></div></div>${profileForm()}</div><div class="source-strip"><p>공식 기관의 공고를 바탕으로 확인합니다.<br><span class="micro">기관 제휴를 의미하지 않습니다.</span></p><div class="source-logos"><span>기업마당</span><span>소상공인시장진흥공단</span><span>서울신용보증재단</span></div><button class="link-btn" data-action="sources" type="button">데이터 안내 ${icon('external')}</button></div></div></section><section class="section"><div class="container"><div class="section-heading"><div><p class="eyebrow">A new opportunity for your business</p><h2>먼저 살펴보는 지원사업</h2><p>우리 사업에 필요한 기회인지, 공고의 조건부터 확인해 보세요.</p></div><a class="link-btn" href="#matches">수록 공고 전체 ${icon('arrow')}</a></div>${staleNote()}<div class="program-grid">${state.feed.slice(0,3).map(p=>programCard(p)).join('')}</div>${sourceStamp()}<div class="journey"><div class="journey-item"><span class="step-number">01 / DISCOVER</span><h3>우리 사업 정보 입력</h3><p>지역과 업종부터 가볍게 시작해요.</p></div><div class="journey-item"><span class="step-number">02 / UNDERSTAND</span><h3>관련 공고와 조건 확인</h3><p>일치·미확인 조건을 나눠 봐요.</p></div><div class="journey-item"><span class="step-number">03 / PREPARE</span><h3>필요한 준비를 차근차근</h3><p>체크리스트로 준비 상태를 관리해요.</p></div><div class="journey-item"><span class="step-number">04 / STAY UPDATED</span><h3>다음 기회도 놓치지 않게</h3><p>맞춤 알림 서비스 출시를 준비해요.</p></div></div></div></section><section class="section"><div class="container"><div class="banner"><div class="banner-copy">${icon('bell','large')}<div><h2>지원금을 찾는 일,<br>매일의 할 일이 되지 않도록.</h2><p>신규 공고와 마감 전 알림을 준비하고 있어요. 출시 소식을 신청하세요.</p></div></div><a class="btn btn-lime" href="#alerts">알림 서비스 먼저 만나기 ${icon('arrow')}</a></div><div class="faq"><details><summary>이 결과가 실제 신청 자격을 보장하나요?</summary><p>아니요. 입력한 정보와 공개 공고에서 확인한 조건을 비교한 탐색 결과입니다. 미확인 조건, 첨부 공고, 제외업종, 예산 및 기관 심사를 별도로 확인해야 합니다.</p></details><details><summary>지원금과 융자는 어떻게 다른가요?</summary><p>융자는 상환이 필요한 자금입니다. 사업비서는 비용 지원, 보험료 환급, 정책수당, 융자, 컨설팅을 구분하며 이를 하나의 예상 수령액으로 합산하지 않습니다.</p></details><details><summary>지금 알림과 결제도 사용할 수 있나요?</summary><p>현재는 공고 탐색·조건 비교·관심 저장·체크리스트를 체험할 수 있습니다. 자동 알림과 유료 상품은 출시 준비 중이며, 결제 정보는 받지 않습니다.</p></details></div></div></section>`;}
function profileChips(){if(!state.profile)return `<div class="inline-note green">사업 정보를 입력하면 지역·공개 조건을 비교할 수 있어요. <a class="source-link" href="#home">사업 정보 입력하기</a></div>`;const p=state.profile;return `<div class="profile-summary"><span>${esc(p.region)} ${esc(p.district)}</span><span>${esc(INDUSTRIES[p.industry])}</span><span>${esc(p.opened)} 개업</span><span>직원 ${p.employees}명</span><span>연매출 ${p.revenue.toLocaleString('ko-KR')}만원</span><span>대표 만 ${p.age}세</span><a class="link-btn" href="#home">정보 수정</a></div>`;}
function filteredPrograms(){return state.feed.map(p=>({p,m:state.profile?compareProgram(p,state.profile):null})).filter(({p,m})=>{
 if(state.filter==='saved'&&!state.saved.includes(p.id))return false;
 if(state.filter==='money'&&!['support','refund','voucher'].includes(p.kind))return false;
 if(state.filter==='loan'&&p.kind!=='loan')return false;
 if(state.filter==='service'&&p.kind!=='service')return false;
 if(state.region!=='all'&&p.regions.length&&!p.regions.includes(state.region))return false;
 if(state.kind!=='all'&&p.kind!==state.kind)return false;
 if(state.filter!=='saved'&&!state.showExcluded&&(m?.excluded||periodState(p).code==='closed'||periodState(p).code==='upcoming'))return false;
 return !state.query||[p.title,p.summary,p.agency,p.category].join(' ').toLowerCase().includes(state.query.toLowerCase());
 }).sort((a,b)=>state.sort==='deadline'?((a.m?.period||periodState(a.p)).days-(b.m?.period||periodState(b.p)).days):state.sort==='newest'?b.p.published.localeCompare(a.p.published):(b.m?.rank||0)-(a.m?.rank||0)).map(x=>x.p);}
function resultsView(saved=false){if(saved)state.filter='saved';const matches=state.feed.filter(p=>state.profile?compareProgram(p,state.profile).eligibleCandidate:!['closed','upcoming'].includes(periodState(p).code));const need=matches.filter(p=>periodState(p).code==='unknown').length;return `<div class="container"><header class="page-header"><p class="breadcrumb"><a href="#home">홈</a> / 지원사업 찾기</p><div class="split-head"><div><p class="eyebrow">Your opportunity board</p><h1>${saved?'관심 있는 기회를 모아두세요.':state.profile?'우리 사업과 관련된 공고를 찾았어요.':'공식 출처의 지원사업을 살펴보세요.'}</h1><p>선정 확률 대신, 확인된 조건과 더 알아봐야 할 내용을 보여드립니다.</p></div><a class="btn btn-green" href="#alerts">${icon('bell')}맞춤 알림 신청</a></div>${profileChips()}</header>${staleNote()}<div class="stats-row"><div class="stat accent"><span>${state.profile?'현재 조건의 검토 후보':'확인할 공고'}</span><strong>${matches.length}<small> 건</small></strong></div><div class="stat"><span>기관 접수 확인 필요</span><strong>${need}<small> 건</small></strong></div><div class="stat"><span>관심 저장</span><strong><span id="saved-stat-count" style="font:inherit;color:inherit">${state.saved.length}</span><small> 건</small></strong></div></div><div class="results-layout"><aside class="filter-sidebar"><h3>공고 좁혀보기</h3><div><label for="filter-region">대상 지역</label><select id="filter-region"><option value="all">모든 지역</option>${REGIONS.map(r=>`<option${selected(r,state.region)}>${r}</option>`).join('')}</select></div><div><label for="filter-kind">지원 방식</label><select id="filter-kind"><option value="all">모든 방식</option>${Object.entries({support:'비용 지원',refund:'보험료 환급',voucher:'정책수당',loan:'융자',service:'교육·컨설팅',unknown:'유형 확인 필요'}).map(([k,v])=>`<option value="${k}"${selected(k,state.kind)}>${v}</option>`).join('')}</select></div><label class="check-label"><input id="show-excluded" type="checkbox"${checked(state.showExcluded)}>기간 종료·예정 및 조건 불일치 공고도 표시</label><div class="sidebar-tip">${icon('info')}공고 원문에 없는 자격조건은 추정하지 않습니다. 매출·인력 기준은 세부 업종에 따라 별도 확인이 필요합니다.</div></aside><div><div class="result-tools"><div class="search-wrap">${icon('search')}<label class="visually-hidden" for="program-search">공고명 또는 기관 검색</label><input id="program-search" placeholder="공고명, 기관, 키워드 검색" value="${esc(state.query)}"></div><label class="visually-hidden" for="sort">정렬</label><select id="sort"><option value="relevance"${selected('relevance',state.sort)}>조건 일치순</option><option value="deadline"${selected('deadline',state.sort)}>마감 가까운순</option><option value="newest"${selected('newest',state.sort)}>등록 최신순</option></select></div><div class="tabs" role="group" aria-label="지원사업 유형"><button type="button" data-action="filter" data-filter="all" aria-pressed="${state.filter==='all'}">전체 후보</button><button type="button" data-action="filter" data-filter="money" aria-pressed="${state.filter==='money'}">지원·환급</button><button type="button" data-action="filter" data-filter="loan" aria-pressed="${state.filter==='loan'}">융자</button><button type="button" data-action="filter" data-filter="service" aria-pressed="${state.filter==='service'}">교육·상담</button><button type="button" data-action="filter" data-filter="saved" aria-pressed="${state.filter==='saved'}">관심 공고</button></div><p id="result-count" class="small muted" aria-live="polite"></p><div class="result-list" id="result-list"></div>${sourceStamp()}</div></div></div>`;}
function refreshResults(){const list=$('#result-list');if(!list)return;const items=filteredPrograms();$('#result-count').textContent=`${items.length}건 표시${state.filter==='saved'?' · 관심 공고는 마감·불일치 상태도 유지합니다.':''}`;list.innerHTML=items.length?items.map(p=>programCard(p,true)).join(''):`<div class="empty-state">${icon('search')}<h2>${state.filter==='saved'?'아직 저장한 공고가 없어요.':'현재 필터에 맞는 공고가 없어요.'}</h2><p>${state.filter==='saved'?'공고 카드의 책갈피를 눌러 관심 있는 사업을 저장해 보세요.':'수록된 일부 공고를 검색한 결과이며, 받을 수 있는 지원사업이 없다는 뜻은 아닙니다. 필터를 바꾸거나 공식 포털을 확인하세요.'}</p><button type="button" class="btn btn-outline" data-action="clear-filters">필터 초기화</button> <a class="btn btn-green" href="https://www.bizinfo.go.kr/" target="_blank" rel="noopener noreferrer">공식 공고 찾기 ${icon('external')}</a></div>`;}
function conditionHtml(c){return `<div class="condition ${c.state}"><span class="condition-sign">${c.state==='yes'?'✓':c.state==='no'?'×':'?'}</span><div><strong>${esc(c.label)}</strong><p>${esc(c.reason)}</p><small>확인 근거: ${esc(c.evidence)}</small></div><span class="badge ${c.state==='unknown'?'amber':c.state==='no'?'red':''}">${c.state==='yes'?'입력값 일치':c.state==='no'?'불일치':'추가 확인'}</span></div>`;}
function detailView(p){const m=state.profile?compareProgram(p,state.profile):null;const period=periodState(p);const explanation=m?m.excluded?'입력한 정보와 일치하지 않는 조건이 있습니다. 해당 조건을 수정하거나 기관에서 예외 적용 여부를 확인하기 전에는 신청 대상으로 판단하지 마세요.':`입력하신 ${state.profile.region} · ${INDUSTRIES[state.profile.industry]} 사업 정보와 비교해 ${m.known}개 항목이 일치합니다. 다만 ${m.unknown}개 항목은 추가 확인이 필요합니다. ${p.unknowns[0]}부터 확인해 보세요.`:'사업 정보를 입력하면 이 공고의 지역·공개 조건을 항목별로 비교해 드립니다.';return `<div class="container"><header class="page-header"><p class="breadcrumb"><a href="#home">홈</a> / <a href="#matches">지원사업</a> / 상세 조건</p><div class="badges"><span class="badge">${esc(p.category)}</span> <span class="badge gray">${p.regions.length?esc(p.regions.join('·')):'전국'}</span> <span class="badge ${period.code==='closed'?'red':'amber'}">${esc(period.label)}</span></div><h1>${esc(p.fullTitle)}</h1><p>${esc(p.agency)} · ${dateLabel(p)} ${esc(p.checkedAt)}</p></header>${staleNote()}${period.code==='closed'?'<div class="inline-note">표시된 신청기간이 종료된 공고입니다. 준비 기록은 열람할 수 있지만 신규 신청 가능 여부는 후속 공고를 확인하세요.</div>':''}<div class="detail-layout"><div><section class="panel"><h2>이 지원사업, 한눈에 보기</h2><p>${esc(p.summary)}</p><dl class="detail-info"><div><dt>지원 대상</dt><dd>${esc(p.target)}</dd></div><div><dt>신청 기간</dt><dd>${esc(p.period)}</dd></div><div><dt>신청 방법</dt><dd>${esc(p.method)}</dd></div><div><dt>공식 문의</dt><dd>${esc(p.contact)}</dd></div></dl></section><section class="panel"><div class="card-heading"><h2>내 조건과 어떻게 맞나요?</h2><span class="badge gray">근거 기반 비교</span></div><p class="small muted">현재 버전은 공고에 근거한 규칙 비교입니다. AI 모델 분석이나 최종 자격 판정이 아닙니다.</p>${m?m.checks.map(conditionHtml).join(''):`<div class="inline-note green">먼저 우리 사업 정보를 입력해 주세요. <a href="#home" class="source-link">무료 조건 확인 시작</a></div>`}<div class="explain-box"><p>${explanation}</p></div><p class="micro">나이·업력·매출·직원 수는 수집한 프로필 정보입니다. 해당 공고에서 검증한 기준이 없는 항목은 합격 조건으로 사용하지 않습니다.</p></section><section class="panel"><h2>신청 전에 꼭 확인할 내용</h2><ul class="simple-list">${p.unknowns.map(x=>`<li function preparationView(p){const values=state.checks[p.id]||[];const count=p.checks.filter((_,i)=>values.includes(i)).length;const percent=Math.round(count/p.checks.length*100);return `<div class="container"><header class="page-header"><p class="breadcrumb"><a href="#matches">지원사업</a> / <a href="#detail/${encodeURIComponent(p.id)}">상세 조건</a> / 준비 체크</p><div class="stepper"><span><b>1</b>공고 확인</span><span><b>2</b>조건 비교</span><span class="current"><b>3</b>신청 준비</span></div><h1>하나씩 준비하면, 조금 더 가까워져요.</h1><p>${esc(p.title)}</p></header><div class="inline-note">체험용 준비 체크리스트입니다. 최종 구비서류 목록이 아니며, 실제 제출서류·발급일 기준은 공식 공고와 접수처에서 확인하세요. 체크 상태만 이 기기에 저장합니다.</div><div class="detail-layout"><section class="panel"><h2>준비 체크리스트 <span class="badge gray">현재 무료 체험</span></h2>${p.checks.map(([title,description],i)=>`<label class="checklist-row"><input type="checkbox" data-check-id="${esc(p.id)}" data-check-index="${i}"${checked(values.includes(i))}><div><strong>${esc(title)}</strong><p>${esc(description)}</p></div></label>`).join('')}<div class="note-block">서류 원본과 사업자등록증은 업로드하지 않습니다. 체크는 본인이 확인한 준비 상태를 표시하는 기능입니다.</div><div class="stack-buttons"><button type="button" class="btn btn-outline" data-action="download-checks" data-id="${esc(p.id)}">${icon('download')}준비 목록 내려받기</button></div></section><aside class="sticky-summary"><div class="panel"><p class="eyebrow">Your progress</p><h2>내 준비 현황</h2><div class="progress-number"><span id="progress-number">${percent}</span><small>%</small></div><div class="progress-track"><div id="progress-bar" class="progress-fill" style="width:${percent}%"></div></div><p id="progress-text" aria-live="polite">${p.checks.length}개 중 ${count}개 확인 · 남은 항목 ${p.checks.length-count}개</p><p class="micro">준비 체크 비율이며 자격 적합도·선정 확률이 아닙니다. 예상 소요기간은 기관별로 다릅니다.</p><a class="btn btn-green btn-full" href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">최종 구비서류 확인 ${icon('external')}</a></div><div class="panel"><h3>더 자세한 분석이 필요하다면</h3><p>공고별 상세 자격 분석·서류 준비 패키지를 준비하고 있어요.</p><p><strong style="color:var(--green)">출시 예정 · 건당 29,900원</strong></p><a class="link-btn" href="#checkout/prepare">패키지 구성 보기 ${icon('arrow')}</a></div></aside></div></div>`;}

function checkoutView(key){const p=PRODUCTS[key]||PRODUCTS.alert;state.selectedProduct=Object.hasOwn(PRODUCTS,key)?key:'alert';return `<div class="container"><header class="page-header"><p class="breadcrumb"><a href="#pricing">이용 요금</a> / 상품 확인</p><h1>내 사업에 필요한 다음 단계를 확인하세요.</h1><p>유료 서비스 출시 전 사전 안내 화면입니다.</p></header><div class="detail-layout"><section class="panel"><span class="badge amber">출시 준비 중</span><h2 style="margin-top:17px">${p.name}</h2><ul class="simple-list">${p.features.map(x=>`<li>${x}</li>`).join('')}</ul><div class="inline-note green">공고 검색은 계속 무료로 이용할 수 있습니다. 유료 서비스는 정기 모니터링과 준비 편의를 제공하는 방향으로 설계합니다.</div><h3>서비스 범위</h3><p>지원사업 선정·지급을 보장하지 않습니다. 신청서 작성·제출 대행은 포함하지 않으며, 자격 있는 전문가의 상담이 필요한 경우 별도 안내할 예정입니다.</p><h3>결제 안내</h3><p>현재 결제창과 결제대행사 연결은 없습니다. 카드번호를 입력하거나 구매를 확정하지 않으며 출시 알림만 신청할 수 있습니다.</p></section><aside><div class="panel"><h2>상품 요약</h2><div class="order-line"><span>상품</span><strong>${p.name}</strong></div><div class="order-line"><span>이용 단위</span><span>${p.unit.replace('/ ','')}</span></div><div class="order-line"><span>출시 예정 가격</span><strong>${p.price.toLocaleString('ko-KR')}원</strong></div><div class="order-line total"><span>지금 결제할 금액</span><strong>0원</strong></div><p class="small">구독 시작이나 구매 완료를 의미하지 않습니다.</p><button type="button" class="btn btn-green btn-full" data-action="product-interest" data-product="${state.selectedProduct}">출시 알림 신청 ${icon('arrow')}</button><a class="btn btn-outline btn-full" style="margin-top:10px" href="#pricing">다른 상품 보기</a></div></aside></div></div>`;}

function alertsView(){return `<div class="container"><header class="page-header"><p class="breadcrumb"><a href="#home">홈</a> / 출시 알림 신청</p></header><div class="alert-layout"><div class="alert-intro"><span class="badge">다음 기회를 위한 준비</span><h2>지원금을 찾지 마세요.<br>기회가 생기면<br><span style="color:var(--green)">먼저 알려드릴게요.</span></h2><p>한 번 입력한 사업 프로필로 새로운 공고를 확인하는 맞춤 알림 서비스를 준비하고 있습니다.</p><div class="alert-features"><div>${icon('search')}<span><strong>새로운 공고, 우리 조건으로</strong><small>지역과 사업 조건에 맞춰 후보 탐색</small></span></div><div>${icon('clock')}<span><strong>마감 전에 다시 한 번</strong><small>놓치기 쉬운 신청 일정 안내</small></span></div><div>${icon('file')}<span><strong>준비할 내용을 한눈에</strong><small>관심 공고와 준비 상태 연결</small></span></div></div><p class="micro">현재 신청은 출시 소식에 대한 관심 접수입니다. 정기 모니터링·알림 발송은 아직 작동하지 않습니다.</p>${profileChips()}</div><div id="alert-form-area">${alertForm()}</div></div></div>`;}
function partnersView(){return `<div class="container"><header class="page-header"><p class="eyebrow">Better together</p><h1>전문가의 경험에,<br>고객의 다음 기회를 더하세요.</h1><p>상담이 필요한 사장님과 고객을 관리하는 전문가를 위한 서비스입니다.</p></header><div class="contact-grid"><section class="contact-card">${icon('people')}<span class="badge gray">연결 서비스 준비 중</span><h2>혼자 준비하기 어려울 때</h2><p>지원사업별 업무범위에 맞는 전문가 연결을 준비합니다. 현재 등록된 전문가나 자동 연결 기능은 없습니다.</p><ul class="simple-list"><li>공고의 공식 문의처에서 먼저 조건 확인</li><li>필요한 상담 분야와 상황 정리</li><li>전문가 연결 출시 시 안내</li></ul><button class="btn btn-green" type="button" data-action="partner-interest" data-purpose="전문가 상담 연결 출시 신청">상담 연결 출시 알림 ${icon('arrow')}</button><p class="micro">플랫폼의 직접 신청서 작성·제출 대행은 제공하지 않습니다.</p></section><section class="contact-card">${icon('building')}<span class="badge gray">B2B 사전 문의</span><h2>고객 여러 명을 관리한다면</h2><p>세무사·노무사·행정사·컨설턴트·프랜차이즈 본사를 위한 고객별 지원사업 관리 도구를 준비합니다.</p><div class="b2b-tiers"><div class="tier">Starter<strong>99,000원</strong>월 예정 가격</div><div class="tier">Business<strong>199,000원</strong>월 예정 가격</div><div class="tier">Partner<strong>299,000원</strong>월 예정 가격</div></div><p>고객 프로필 관리 · 관련 공고 발견 · 담당자 확인 · 안내 이력 관리</p><button class="btn btn-outline" type="button" data-action="partner-interest" data-purpose="B2B 고객관리 솔루션 도입 문의">비즈니스 도입 문의 ${icon('arrow')}</button><p class="micro">고객 데이터 업로드·관리 기능은 미구현입니다. 초기 상담 단계에서는 고객의 개인정보를 입력하지 마세요.</p></section></div><section class="section"><div class="banner"><div><h2>전문가 파트너로 함께하고 싶으신가요?</h2><p>전문 분야와 희망 협업 방식을 남겨 주세요. 입점 조건은 추후 안내합니다.</p></div><button class="btn btn-lime" type="button" data-action="partner-interest" data-purpose="전문가 입점·제휴 문의">파트너 관심 등록 ${icon('arrow')}</button></div></section></div>`;}
function unknownView(){return `<div class="container section"><div class="empty-state">${icon('search')}<h2>이 공고를 찾을 수 없어요.</h2><p>데이터가 변경되었거나 주소가 올바르지 않습니다. 공고 목록에서 다시 선택해 주세요.</p><a class="btn btn-green" href="#matches">공고 목록으로</a></div></div>`;}
function render(){const route=location.hash.slice(1)||'home';const [page,idRaw]=route.split('/');let id='';try{id=decodeURIComponent(idRaw||'');}catch{}let html;const p=getProgram(id);if(page==='home'||page==='main')html=homeView();else if(page==='matches'||page==='saved')html=resultsView(page==='saved');else if(page==='detail')html=p?detailView(p):unknownView();else if(page==='prepare')html=p?preparationView(p):unknownView();else if(page==='pricing')html=pricingView();else if(page==='checkout')html=checkoutView(id);else if(page==='alerts')html=alertsView();else if(page==='partners')html=partnersView();else html=unknownView();$('#main').innerHTML=html;$('#saved-count').textContent=state.saved.length;$$('[data-nav]').forEach(link=>{const active=link.dataset.nav===page||(link.dataset.nav==='home'&&['matches','detail','prepare'].includes(page));link.classList.toggle('active',active);if(active)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');});$('#main-nav').classList.remove('open');$('.mobile-menu').setAttribute('aria-expanded','false');document.title=`${{home:'내 사업의 다음 기회',matches:'지원사업 찾기',saved:'관심 공고',detail:p?.title,prepare:'준비 체크리스트',pricing:'이용 요금',checkout:'출시 예정 상품',alerts:'출시 알림 신청',partners:'전문가·비즈니스'}[page]||'지원사업 찾기'} | 사업비서`;if($('#result-list'))refreshResults();}
function sourceDialog(){openModal('공고 출처와 업데이트',`<div class="inline-note green">${esc(state.feedLabel)} · ${esc(state.feedDate)} ${state.feed.some(p=>p.rule==='imported')?'가져옴':'확인'} · ${state.feed.length}건<br>${state.feed.some(p=>p.rule==='imported')?'가져온 날짜는 원문 확인일이 아닙니다. 조건과 최신성은 별도 검토해야 합니다.':'수록 공고는 수동으로 확인한 일부 데이터입니다.'} 실시간 전체 공고를 조회한 결과가 아닙니다.</div>${state.feed.map(p=>`<div class="source-item"><strong>${esc(p.title)}</strong><p>${esc(p.sourceName)} · ${dateLabel(p)} ${esc(p.checkedAt)}${p.rule==='imported'?' · 가져온 데이터, 조건 검토 전':''}</p><a class="source-link" href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">공식 원문 ${icon('external')}</a>${p.useNote?`<p>${esc(p.useNote)}</p>`:''}</div>`).join('')}<details class="source-admin"><summary>운영자용 데이터 연결</summary><p>기업마당에서 발급받은 인증키는 서버에서만 사용하세요. 이 화면에는 키를 입력하지 않습니다. 공식 API JSON 파일을 불러오거나 CONFIG.publicFeedUrl의 공개 피드를 조회할 수 있습니다. 가져온 데이터는 이 탭에서만 유지됩니다.</p><a href="https://www.bizinfo.go.kr/apiDetail.do?id=bizinfoApi" target="_blank" rel="noopener noreferrer" class="source-link small">공식 API 사용신청·필드 안내</a><p>지원 형식: jsonArray.item, jsonArray 배열, 배열 또는 { items: [...] }. 공식 공고 URL이 있는 항목만 가져옵니다. HTML 본문은 텍스트로만 처리합니다.</p><label for="feed-file" class="small">기업마당 JSON 파일 불러오기</label><input id="feed-file" type="file" accept="application/json,.json"><div class="row"><button class="btn btn-outline btn-small" type="button" data-action="refresh-feed">공개 피드 새로고침</button><button class="btn btn-outline btn-small" type="button" data-action="builtin-feed">기본 확인본으로 복원</button></div><p id="feed-status" role="status"></p></details><p class="micro">기업마당의 콘텐츠 수익 이용에는 별도 협의 안내가 있습니다. API 발급과 상업적 이용 허락을 동일하게 취급하지 마세요. <a class="source-link" href="https://www.bizinfo.go.kr/biz/bizd/selectBIZD120View.do" target="_blank" rel="noopener noreferrer">이용정책 확인</a></p>`);}
function privacyDialog(){const live=receptionReady();openModal('개인정보와 저장 안내',`<p>기본 검색과 조건 비교는 이 페이지 안에서 처리합니다. 사업자등록번호, 계좌, 주민등록번호, 서류 원본은 수집하지 않습니다.</p><ul class="simple-list"><li>‘이 기기에 저장’을 선택한 사업 프로필, 관심 공고, 준비 체크 상태는 브라우저에 저장됩니다.</li><li>이 기기 저장정보 삭제 버튼으로 본 서비스가 저장한 정보만 삭제할 수 있습니다.</li><li>접수 전 이름·이메일은 브라우저 영구 저장소에 저장하지 않습니다.</li></ul>${live?`<div class="inline-note green">출시 안내 접수 운영자: ${esc(CONFIG.privacy.operator)}<br>목적: 신청한 서비스의 출시 및 도입 안내<br>항목: 이름·사업장명, 이메일, 희망 채널, 소식 선호도, 선택한 문의 내용·사업 프로필<br>보유 기간: ${esc(CONFIG.privacy.retention)}<br>문의·철회: ${esc(CONFIG.privacy.contact)}<br>동의를 거부할 수 있으며 동의하지 않으면 온라인 접수가 제한됩니다.</div>`:'<div class="inline-note">현재는 접수처 미연결 상태입니다. 입력 내용은 외부로 전송되지 않으며, 직접 다운로드한 신청서 파일은 사용자의 기기에 저장됩니다.</div>'}<p>공식 원문 링크를 열면 해당 기관의 사이트로 이동하며 그 기관의 개인정보 정책이 적용됩니다.</p>`);}
function textFromHtml(value){const doc=new DOMParser().parseFromString(String(value||''),'text/html');doc.querySelectorAll('script,style,iframe,object').forEach(el=>el.remove());return (doc.body.textContent||'').replace(/\s+/g,' ').trim();}
function normalizeFeed(raw){let rows=Array.isArray(raw)?raw:raw?.jsonArray?.item??raw?.jsonArray??raw?.items??raw?.item;if(rows&&typeof rows==='object'&&!Array.isArray(rows)&&rows.title)rows=[rows];if(!Array.isArray(rows))throw new Error('지원하지 않는 JSON 구조입니다. 공식 API의 item 배열을 확인해 주세요.');if(rows.length>5000)throw new Error('한 번에 최대 5,000건을 불러올 수 있습니다.');const result=[];let skipped=0;const seen=new Set();for(const item of rows){if(!item||typeof item!=='object'){skipped++;continue;}const title=textFromHtml(item.pblancNm||item.title).slice(0,250);let rawUrl=item.pblancUrl||item.link||item.source||'';if(String(rawUrl).startsWith('/'))rawUrl='https://www.bizinfo.go.kr'+rawUrl;const source=officialUrl(rawUrl);let id=String(item.pblancId||item.seq||item.id||'');if(!id&&source)id=new URL(source).searchParams.get('pblancId')||'';if(!title||!source||!/^(?:PBLN_|GANGHWA-)[-\w]{1,90}$/.test(id)||seen.has(id)){skipped++;continue;}seen.add(id);const period=textFromHtml(item.reqstBeginEndDe||item.reqstDt||item.period||'기간 원문 확인').slice(0,100);const dates=parsePeriod(period);const tagged=textFromHtml(item.hashTags||'').split(/[,\s]+/);const exactRegion=title.match(/^\[([^\]]+)\]/)?.[1]||'';let regions=REGIONS.filter(r=>tagged.includes(r)||exactRegion.split(/[ㆍ·,\s]+/).includes(r));if(regions.length>=15)regions=[];const summary=textFromHtml(item.bsnsSumryCn||item.description||item.summary).slice(0,700);result.push({id,title,fullTitle:title,category:textFromHtml(item.pldirSportRealmLclasCodeNm||item.lcategory||'분야 확인').slice(0,40),kind:'unknown',benefit:'지원 규모·방식 원문 확인',summary:summary||'공식 공고 원문에서 사업개요를 확인해 주세요.',regions,district:'',source,sourceName:'기업마당 API 가져오기',agency:textFromHtml(item.excInsttNm||item.jrsdInsttNm||item.author||'기관 원문 확인').slice(0,100),...dates,period,checkedAt:koreaToday(),published:String(item.creatPnttm||item.pubDate||'').slice(0,10),rule:'imported',benefitNote:'가져온 공고는 자동으로 금액·조건을 확정하지 않습니다. 세부 지원방식과 상환 여부도 원문을 확인하세요.',target:textFromHtml(item.trgetNm||'세부 지원대상 원문 확인').slice(0,300),method:textFromHtml(item.reqstMthPapersCn||'공식 공고의 접수 방법 확인').slice(0,300),contact:textFromHtml(item.refrncNm||'공식 공고 문의처 확인').slice(0,200),unknowns:['업종·업력·매출·인력·소재지의 세부 조건','첨부자료·지원방식·제외요건·현재 접수 상태'],checks:[['공고의 지원대상 확인','현재 사업 프로필과 세부 지원대상을 대조하세요.'],['지원방식·자부담·상환 여부 확인','보조금인지 융자인지 공식 공고에서 확인하세요.'],['공식 제출서류 목록 확인','첨부 공고와 접수 화면에서 구비서류를 확인하세요.'],['접수기간·문의처 확인','원문 기준의 접수 방법과 마감 시간을 확인하세요.']]});}if(!result.length)throw new Error('가져올 수 있는 공식 공고가 없습니다. ID와 공식 원문 URL을 확인해 주세요.');return {items:result,skipped};}
function applyFeed(raw,label){const normalized=normalizeFeed(raw);state.feed=normalized.items;state.feedLabel=label;state.feedDate=koreaToday();state.filter='all';state.query='';render();sourceDialog();$('#modal .source-admin').open=true;$('#feed-status').textContent=`${normalized.items.length}건을 가져왔습니다. ${normalized.skipped}건은 중복·누락·지원하지 않는 URL로 제외했습니다. 가져온 날짜는 원문 확인일이 아닙니다.`;}
async function refreshFeed(){if(feedLoading)return;if(!CONFIG.publicFeedUrl){$('#feed-status').textContent='공개 피드가 아직 설정되지 않았습니다. CONFIG.publicFeedUrl에 서버의 공개 JSON 주소를 연결하세요.';return;}if(!/^https:\/\//.test(CONFIG.publicFeedUrl)){ $('#feed-status').textContent='공개 피드는 HTTPS 주소로 설정해 주세요.';return;}feedLoading=true;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);try{$('#feed-status').textContent='공개 피드를 확인하고 있습니다…';const response=await fetch(CONFIG.publicFeedUrl,{signal:controller.signal,credentials:'omit',headers:{Accept:'application/json'}});if(!response.ok)throw new Error('피드 요청에 실패했습니다.');const body=await response.text();if(body.length>10000000)throw new Error('피드가 너무 큽니다. 10MB 이내로 나누어 주세요.');applyFeed(JSON.parse(body),'설정된 공개 피드 · 원문 검토 전');}catch(error){const target=$('#feed-status');if(target)target.textContent=`불러오지 못했습니다. 기존 공고를 유지합니다. ${error.name==='AbortError'?'응답 시간 초과':error.message}`;}finally{clearTimeout(timer);feedLoading=false;}}
function downloadFile(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob(['\uFEFF',text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function requestText(data){const lines=['사업비서 서비스 관심 신청서',`종류: ${data.purpose}`,`작성 시각: ${data.createdAt}`,`이름·사업장: ${data.name}`,`이메일: ${data.email}`,`희망 채널: ${data.channel==='kakao'?'카카오':'이메일'}`,`희망 소식: ${data.preferences.join(', ')}`,`문의: ${data.message||'없음'}`];if(data.profile){const p=data.profile;lines.push(`사업 프로필: ${p.region} ${p.district} / ${INDUSTRIES[p.industry]} / ${p.opened} 개업 / 직원 ${p.employees}명 / 연매출 ${p.revenue}만원 / 만 ${p.age}세`);}lines.push('',data.receiptId?`서버 접수번호: ${data.receiptId}`:'미리보기 신청서입니다. 운영자에게 전송되거나 실제 접수되지 않았습니다.','정기 알림 활성화 및 유료 서비스 구매를 의미하지 않습니다.');return lines.join('\n');}
async function submitContact(form){if(sending)return;const f=new FormData(form);if(f.get('website'))return;$('#contact-name').setCustomValidity(String(f.get('name')).trim()?'':'이름 또는 사업장명을 입력해 주세요.');if(!form.reportValidity())return;const data={purpose:state.contactPurpose,name:String(f.get('name')).trim(),email:String(f.get('email')).trim(),channel:f.get('channel'),preferences:f.getAll('news'),message:String(f.get('message')).trim(),consent:f.get('consent')==='on',profile:f.get('includeProfile')==='on'?state.profile:null,createdAt:new Date().toISOString()};$('#contact-error').textContent='';if(!receptionReady()){state.latestRequest=data;showContactResult(false);return;}sending=true;$('#contact-submit').disabled=true;$('#contact-submit').textContent='접수 중…';const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);try{const response=await fetch(CONFIG.receptionUrl,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(data),credentials:'omit',signal:controller.signal});if(!response.ok)throw new Error('접수 서버 응답 오류');const receipt=await response.json();if(receipt.accepted!==true||typeof receipt.id!=='string'||!receipt.id)throw new Error('접수 확인 응답이 없습니다.');data.receiptId=receipt.id.slice(0,100);state.latestRequest=data;showContactResult(true);}catch(error){if($('#contact-error'))$('#contact-error').textContent='접수 완료를 확인하지 못했습니다. 입력 내용은 유지됩니다. 중복 신청을 피하려면 운영자에게 접수 여부를 먼저 확인해 주세요.';}finally{clearTimeout(timer);sending=false;if($('#contact-submit')){$('#contact-submit').disabled=false;$('#contact-submit').textContent='출시 알림 신청 접수';}}}
function showContactResult(live){const d=state.latestRequest;$('#alert-form-area').innerHTML=`<div class="panel success-box"><div class="success-symbol">${icon('check')}</div><span class="badge ${live?'':'amber'}">${live?'출시 관심 접수':'전송 없는 미리보기'}</span><h2>${live?'출시 관심을 접수했어요.':'신청서 미리보기를 만들었어요.'}</h2><p>${live?`${esc(d.email)}로 출시 소식을 안내할 예정입니다. 접수번호: ${esc(d.receiptId)}`:'신청 내용은 운영자에게 전송되지 않았습니다. 파일을 내려받아 보관할 수 있습니다.'}</p><p>자동 공고 알림이나 유료 구독이 시작된 것은 아닙니다.</p><div class="stack-buttons"><button type="button" class="btn btn-green" data-action="download-request">${icon('download')}신청 내용 내려받기</button><button type="button" class="btn btn-outline" data-action="edit-request">신청 내용 다시 작성</button><a class="link-btn" style="justify-self:center" href="#matches">지원사업 계속 살펴보기 ${icon('arrow')}</a></div></div>`;$('#alert-form-area h2').setAttribute('tabindex','-1');$('#alert-form-area h2').focus();}
document.addEventListener('click',event=>{if(event.target.closest('a[href="#alerts"]'))state.contactPurpose='알림 출시 신청';const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;const id=button.dataset.id;
 if(action==='close')$('#modal').close();
 else if(action==='sources')sourceDialog();else if(action==='privacy')privacyDialog();
 else if(action==='example'){const form=$('#profile-form');const sample={region:'서울',district:'마포구',industry:'cafe',opened:'2023-09-01',employees:'2',revenue:'20000',age:'48',active:'yes',certificate:'yes',store:'yes',insurance:'unknown'};Object.entries(sample).forEach(([k,v])=>{form.elements[k].value=v;});toast('예시 사업 정보를 채웠어요. 무료로 찾아보기를 눌러 주세요.');}
 else if(action==='save'){const idx=state.saved.indexOf(id);if(idx>=0)state.saved.splice(idx,1);else state.saved.push(id);saveLocal();$('#saved-count').textContent=state.saved.length;if($('#saved-stat-count'))$('#saved-stat-count').textContent=state.saved.length;$$('[data-action="save"]').forEach(el=>{if(el.dataset.id!==id)return;el.setAttribute('aria-pressed',String(state.saved.includes(id)));if(!el.classList.contains('save-btn'))el.innerHTML=icon('bookmark')+(state.saved.includes(id)?'관심 저장됨':'관심 공고 저장');});if(state.filter==='saved')refreshResults();toast(idx>=0?'관심 저장을 해제했어요.':'이 기기에 관심 공고를 저장했어요.');}
 else if(action==='filter'){state.filter=button.dataset.filter;$$('[data-action="filter"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===state.filter)));refreshResults();}
 else if(action==='clear-filters'){state.filter='all';state.region='all';state.kind='all';state.query='';state.showExcluded=false;navigate('#matches');}
 else if(action==='product-interest'){state.contactPurpose=PRODUCTS[button.dataset.product]?.purpose||PRODUCTS.alert.purpose;navigate('#alerts');}
 else if(action==='partner-interest'){state.contactPurpose=button.dataset.purpose;navigate('#alerts');}
 else if(action==='download-request'){if(state.latestRequest)downloadFile('사업비서-관심신청서.txt',requestText(state.latestRequest));}
 else if(action==='edit-request'){$('#alert-form-area').innerHTML=alertForm();const data=state.latestRequest;if(data){$('#contact-name').value=data.name;$('#contact-email').value=data.email;$('#contact-message').value=data.message;$('#interest-channel').value=data.channel;$$('input[name="news"]').forEach(el=>{el.checked=data.preferences.includes(el.value);});}}
 else if(action==='download-checks'){const p=getProgram(id);if(!p)return;const c=state.checks[id]||[];downloadFile('사업비서-준비체크리스트.txt',[p.fullTitle,`출처: ${p.source}`,`공고 ${dateLabel(p)}: ${p.checkedAt}`,'체험용 준비 목록입니다. 공식 구비서류 목록이 아닙니다.','',...p.checks.map(([t,d],i)=>`${c.includes(i)?'[✓]':'[ ]'} ${t}\n    ${d}`)].join('\n'));}
 else if(action==='refresh-feed')refreshFeed();else if(action==='builtin-feed'){state.feed=BUILTIN;state.feedDate=SNAPSHOT_DATE;state.feedLabel='공식 공고 수동 확인본';render();sourceDialog();}
 else if(action==='reset')openModal('이 기기의 저장정보를 지울까요?',`<p>사업비서의 사업 프로필·관심 공고·준비 체크 기록을 이 기기에서 삭제합니다. 다른 사이트의 저장정보에는 영향을 주지 않습니다. 서버에 제출한 신청은 삭제되지 않습니다.</p><button type="button" class="btn btn-dark" data-action="confirm-reset">이 기기 기록 삭제</button>`);
 else if(action==='confirm-reset'){try{localStorage.removeItem(STORAGE_KEY);}catch{}state.profile=null;state.remember=false;state.saved=[];state.checks={};state.latestRequest=null;$('#modal').close();render();toast('이 기기에 저장한 사업비서 기록을 삭제했어요.');}
});
document.addEventListener('submit',event=>{if(event.target.id==='profile-form'){event.preventDefault();const f=new FormData(event.target);const p={region:f.get('region'),district:String(f.get('district')).trim(),industry:f.get('industry'),opened:f.get('opened'),employees:Number(f.get('employees')),revenue:Number(f.get('revenue')),age:Number(f.get('age')),active:f.get('active'),certificate:f.get('certificate'),store:f.get('store'),insurance:f.get('insurance')};if(!event.target.reportValidity()||!validateProfile(p)){$('#profile-error').textContent='사업 개시일과 숫자 입력값을 확인해 주세요.';return;}state.profile=p;state.remember=f.get('remember')==='on';saveLocal();state.filter='all';state.region='all';state.kind='all';state.query='';state.showExcluded=false;navigate('#matches');}else if(event.target.id==='alert-form'){event.preventDefault();submitContact(event.target);}});
document.addEventListener('input',event=>{if(event.target.id==='program-search'){state.query=event.target.value;refreshResults();}if(event.target.id==='contact-name')event.target.setCustomValidity('');});
document.addEventListener('change',async event=>{const el=event.target;if(el.id==='filter-region'){state.region=el.value;refreshResults();}else if(el.id==='filter-kind'){state.kind=el.value;refreshResults();}else if(el.id==='sort'){state.sort=el.value;refreshResults();}else if(el.id==='show-excluded'){state.showExcluded=el.checked;refreshResults();}else if(el.matches('[data-check-id]')){const id=el.dataset.checkId;const index=Number(el.dataset.checkIndex);const values=state.checks[id]||[];state.checks[id]=el.checked?[...new Set([...values,index])]:values.filter(x=>x!==index);saveLocal();const p=getProgram(id);const count=p.checks.filter((_,i)=>state.checks[id].includes(i)).length;const percent=Math.round(count/p.checks.length*100);$('#progress-number').textContent=percent;$('#progress-bar').style.width=percent+'%';$('#progress-text').textContent=`${p.checks.length}개 중 ${count}개 확인 · 남은 항목 ${p.checks.length-count}개`;}else if(el.id==='feed-file'){const file=el.files[0];if(!file)return;try{if(file.size>10000000)throw new Error('10MB 이하의 JSON 파일을 선택해 주세요.');const text=await file.text();applyFeed(JSON.parse(text.replace(/^\uFEFF/,'')),'사용자 제공 API JSON · 원문 검토 전');}catch(error){$('#feed-status').textContent=`불러오지 못했습니다. 기존 공고를 유지합니다. ${error.message}`;}}});
$('.mobile-menu').addEventListener('click',()=>{const open=$('.mobile-menu').getAttribute('aria-expanded')!=='true';$('.mobile-menu').setAttribute('aria-expanded',String(open));$('#main-nav').classList.toggle('open',open);});
$('#modal').addEventListener('click',event=>{if(event.target!==$('#modal'))return;const r=$('#modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)$('#modal').close();});
window.addEventListener('hashchange',()=>{if($('#modal').open)$('#modal').close();render();window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true});});
$('#year').textContent=new Date().getFullYear();loadLocal();render();

// Server data is a collected snapshot, not an eligibility decision.
async function loadDatabaseFeed(){
 if(!/^https?:$/.test(location.protocol))return;
 const notice=document.createElement('div');notice.id='database-status';notice.setAttribute('role','status');notice.style.cssText='padding:12px 24px;background:#edf4ee;color:#244d3c;font-size:13px;text-align:center;border-bottom:1px solid #d6e4d9';document.body.prepend(notice);
 notice.textContent='공고 데이터베이스 연결 확인 중…';
 try{
  const response=await fetch('/api/programs',{signal:AbortSignal.timeout(10000)});if(!response.ok)throw new Error('unavailable');
  const data=await response.json();if(!Array.isArray(data.items)||!data.meta)throw new Error('invalid');
  if(!data.items.length){notice.textContent='DB 수집 공고 0건 · '+(data.meta.configured?'첫 수집 결과 대기':'기업마당 API 키 설정 대기')+' · 아래는 수동 확인한 예시 공고입니다. ';}
  else{
   const mapped=data.items.map(p=>({pblancId:p.sourceId,pblancNm:p.title,pblancUrl:p.sourceUrl,bsnsSumryCn:p.bodyText,jrsdInsttNm:p.agency,excInsttNm:p.executor,pldirSportRealmLclasCodeNm:p.category,reqstBeginEndDe:p.periodText,creatPnttm:p.publishedAt,trgetNm:p.targetText,reqstMthPapersCn:p.applicationMethod,refrncNm:p.contactText}));
   const normalized=normalizeFeed(mapped);state.feed=normalized.items.map((p,i)=>({...p,regions:[],sourceName:data.items[i].origin==='api'?'기업마당 API · DB 수집본':'운영자 JSON 가져오기 · DB 보관',checkedAt:data.items[i].lastObservedAt.slice(0,10)}));
   state.feedLabel='DB 공고 · 자격조건 분석 대기';state.feedDate=data.items[0].lastObservedAt.slice(0,10);
   notice.textContent='DB 공고 '+data.meta.total+'건 · '+(data.items.some(p=>p.origin==='import')?'수동 가져오기 포함 · ':'')+'조건 분석 전: 지역·업종·매출에 따른 자격 확정 결과가 아닙니다.'+(data.meta.hasMore?' 화면에는 최신 5,000건을 표시합니다.':'');
   if(!document.querySelector('input:focus,select:focus,textarea:focus'))render();
  }
  const link=document.createElement('a');link.href='/admin';link.textContent=' 수집 관리';link.style.color='inherit';notice.append(link);
 }catch{notice.textContent='수집 서버 미연결 · 수동 확인 공고를 표시합니다. 백엔드 실행 주소에서 열어 주세요.';}
}
loadDatabaseFeed();

</script>
